openapi: 3.1.0
info:
  title: Carsenda API
  version: 0.1.0
  description: >-
    Vehicle transport marketplace. Two-sided: shippers create shipments and
    receive quotes; carriers browse open shipments and bid. Authorisation is
    enforced by Postgres row level security, so every endpoint returns only
    rows the caller's JWT subject may see. This contract is frozen before
    implementation so client surfaces can build against generated mocks.
servers:
  - url: https://api.carsenda.com/v1
    description: Production
  - url: http://localhost:54321/rest/v1
    description: Local Supabase

security:
  - bearerAuth: []

tags:
  - name: Quotes
  - name: Shipments
  - name: Bids
  - name: Carriers
  - name: Condition reports

paths:
  /quotes:
    post:
      tags: [Quotes]
      summary: Price a lane
      description: >-
        Deterministic. Identical inputs always return identical cents. Does not
        persist a shipment and does not require carrier availability.
      operationId: createQuote
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QuoteRequest' }
      responses:
        '200':
          description: Quote produced
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QuoteResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /shipments:
    get:
      tags: [Shipments]
      summary: List shipments visible to the caller
      description: >-
        Shippers see their own. Carrier members see shipments open for bids plus
        any assigned to their carrier. Admins see all. Scoping is enforced in the
        database, not in this layer.
      operationId: listShipments
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/ShipmentStatus' } }
        - { name: limit,  in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        '200':
          description: Shipments
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Shipment' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Shipments]
      summary: Create a shipment
      operationId: createShipment
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ShipmentCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Shipment' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /shipments/{shipmentId}:
    parameters:
      - { name: shipmentId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Shipments]
      summary: Retrieve a shipment
      operationId: getShipment
      responses:
        '200':
          description: Shipment
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Shipment' }
        '404': { $ref: '#/components/responses/NotFound' }

  /shipments/{shipmentId}/matches:
    parameters:
      - { name: shipmentId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Carriers]
      summary: Ranked eligible carriers for a shipment
      description: >-
        Eligibility gates are absolute: a carrier without active operating
        authority, with insurance expiring before the pickup window closes, with
        mismatched equipment, or at route capacity is never returned regardless
        of score.
      operationId: matchCarriers
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 10 } }
      responses:
        '200':
          description: Ranked carriers
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CarrierMatch' }
        '404': { $ref: '#/components/responses/NotFound' }

  /shipments/{shipmentId}/bids:
    parameters:
      - { name: shipmentId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Bids]
      summary: List bids
      description: >-
        The shipment owner sees all bids on their shipment. A carrier sees only
        its own bid. Competitor bid amounts are never disclosed to carriers.
      operationId: listBids
      responses:
        '200':
          description: Bids
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Bid' }
    post:
      tags: [Bids]
      summary: Place a bid
      description: One live bid per carrier per shipment; a repeat submission replaces it.
      operationId: createBid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount_cents]
              properties:
                amount_cents: { type: integer, minimum: 1, examples: [235000] }
      responses:
        '201':
          description: Bid placed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Bid' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Shipment is not open for bids

  /shipments/{shipmentId}/condition-reports:
    parameters:
      - { name: shipmentId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Condition reports]
      summary: Record a condition report
      description: >-
        Exactly one report per phase. At least one photo is required; a bill of
        lading without photographic evidence is not a defensible record.
      operationId: createConditionReport
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConditionReportCreate' }
      responses:
        '201':
          description: Recorded
        '409':
          description: A report already exists for this phase

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Supabase JWT. The 'sub' claim drives all row level security.

  responses:
    BadRequest:
      description: Invalid input
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Missing or invalid token
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Authenticated but not permitted
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Not found, or not visible to this caller
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:    { type: string, examples: ['not_open_for_bids'] }
        message: { type: string }

    VehicleClass:
      type: string
      enum: [sedan, suv, pickup, oversized]
    TransportType:
      type: string
      enum: [open, enclosed]
    ShipmentStatus:
      type: string
      enum: [quoted, open_for_bids, assigned, picked_up, in_transit, delivered, cancelled]
    BidStatus:
      type: string
      enum: [open, accepted, rejected, withdrawn]

    Point:
      type: object
      required: [lat, lon]
      properties:
        lat: { type: number, minimum: -90,  maximum: 90,  examples: [25.7617] }
        lon: { type: number, minimum: -180, maximum: 180, examples: [-80.1918] }

    QuoteRequest:
      type: object
      required: [origin, destination, vehicle_class, transport_type, operable, pickup_date]
      properties:
        origin:         { $ref: '#/components/schemas/Point' }
        destination:    { $ref: '#/components/schemas/Point' }
        vehicle_class:  { $ref: '#/components/schemas/VehicleClass' }
        transport_type: { $ref: '#/components/schemas/TransportType' }
        operable:       { type: boolean, examples: [true] }
        pickup_date:    { type: string, format: date, examples: ['2026-09-10'] }

    QuoteResponse:
      type: object
      required: [distance_mi, quote_cents, currency]
      properties:
        distance_mi: { type: number, examples: [3199.4] }
        quote_cents: { type: integer, examples: [224400] }
        currency:    { type: string, enum: [USD] }

    ShipmentCreate:
      type: object
      required: [vehicle_id, origin, destination, origin_label, destination_label,
                 pickup_window_start, pickup_window_end, transport_type]
      properties:
        vehicle_id:          { type: string, format: uuid }
        origin:              { $ref: '#/components/schemas/Point' }
        destination:         { $ref: '#/components/schemas/Point' }
        origin_label:        { type: string, examples: ['Miami, FL'] }
        destination_label:   { type: string, examples: ['Seattle, WA'] }
        pickup_window_start: { type: string, format: date }
        pickup_window_end:   { type: string, format: date }
        transport_type:      { $ref: '#/components/schemas/TransportType' }

    Shipment:
      type: object
      required: [id, status, origin_label, destination_label]
      properties:
        id:                  { type: string, format: uuid }
        shipper_id:          { type: string, format: uuid }
        vehicle_id:          { type: string, format: uuid }
        origin_label:        { type: string }
        destination_label:   { type: string }
        pickup_window_start: { type: string, format: date }
        pickup_window_end:   { type: string, format: date }
        transport_type:      { $ref: '#/components/schemas/TransportType' }
        status:              { $ref: '#/components/schemas/ShipmentStatus' }
        distance_mi:         { type: number }
        quoted_cents:        { type: integer }
        assigned_carrier_id: { type: [string, 'null'], format: uuid }
        created_at:          { type: string, format: date-time }

    CarrierMatch:
      type: object
      required: [carrier_id, legal_name, fit_score]
      properties:
        carrier_id:          { type: string, format: uuid }
        legal_name:          { type: string, examples: ['Sunbelt Auto Transport'] }
        route_id:            { type: string, format: uuid }
        origin_deviation_mi: { type: number, examples: [0.0] }
        dest_deviation_mi:   { type: number, examples: [0.0] }
        fit_score:
          type: number
          minimum: 0
          maximum: 1
          description: >-
            0.45 origin fit + 0.25 destination fit + 0.20 rating + 0.10 acceptance rate.
          examples: [0.9840]

    Bid:
      type: object
      required: [id, shipment_id, carrier_id, amount_cents, status]
      properties:
        id:           { type: string, format: uuid }
        shipment_id:  { type: string, format: uuid }
        carrier_id:   { type: string, format: uuid }
        amount_cents: { type: integer, examples: [235000] }
        status:       { $ref: '#/components/schemas/BidStatus' }
        created_at:   { type: string, format: date-time }

    ConditionReportCreate:
      type: object
      required: [phase, photo_paths]
      properties:
        phase:       { type: string, enum: [pickup, delivery] }
        odometer:    { type: integer, minimum: 0 }
        damages:
          type: array
          items:
            type: object
            properties:
              panel:    { type: string, examples: ['front_bumper'] }
              severity: { type: string, enum: [minor, moderate, severe] }
              note:     { type: string }
        photo_paths:
          type: array
          minItems: 1
          items: { type: string }
